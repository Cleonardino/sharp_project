version: "3.9"
services:
  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: mlflow
      MYSQL_USER: mlflow
      MYSQL_PASSWORD: mlflow_pwd
      MYSQL_ROOT_PASSWORD: root_pwd
    ports:
      - "3306:3306"
    networks:
      - tps

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data
    ports:
      - "9000:9000"
    networks:
      - tps

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
    ports:
      - "5000:5000"
    depends_on:
      - mysql-db
      - minio
    networks:
      - tps

  training:
    build:
      context: ./training
      dockerfile: Dockerfile
    depends_on:
      - mysql-db
      - minio
    networks:
      - tps

networks:
  tps:
    driver: bridge
