services:
  mysql-db:
    image: mysql:8.2
    ports:
      - "3306:3306"
    env_file:
      - config/.env
    networks:
      - tps
    volumes:
      - mysql_data:/var/lib/mysql

  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    env_file:
      - config/.env
    networks:
      - tps
    volumes:
      - minio_data:/data
    command: server --console-address "0.0.0.0:9001" /data

  mlflow:
    image: mlflow-local-server:1.0
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    ports:
      - "5001:5000"
    env_file:
      - config/.env
    networks:
      - tps
    depends_on:
      - mysql-db
      - minio

volumes:
  mysql_data:
  minio_data:

networks:
  tps:
