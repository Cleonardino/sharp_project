version: "3.8"

services:
  mysql-db:
    image: mysql:8.2
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: mlflow
      MYSQL_USER: mlflow
      MYSQL_PASSWORD: mlflow_pwd
    command: --log-bin-trust-function-creators=1
    networks:
      - tps
    volumes:
      - mysql_data:/var/lib/mysql

  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    networks:
      - tps
    volumes:
      - minio_data:/data
    command: server --console-address "0.0.0.0:9001" /data

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    image: mlflow-local-server:1.0
    ports:
      - "5001:5000"
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    networks:
      - tps
    depends_on:
      - mysql-db
      - minio
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri mysql+pymysql://mlflow:mlflow_pwd@mysql-db:3306/mlflow
      --default-artifact-root s3://mlflow

volumes:
  mysql_data:
  minio_data:

networks:
  tps:
